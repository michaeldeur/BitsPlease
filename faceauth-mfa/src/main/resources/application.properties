server.port=8080
spring.application.name=faceauth-mfa

# ---------- Database (H2 file database, MySQL compatibility mode) ----------
# Data is saved in ./data/faceauth.mv.db so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/faceauth;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user "sa", blank password)
spring.h2.console.enabled=true

# ---------- Session cookie hardening ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ---------- App settings ----------
# Euclidean distance between 128-d face descriptors. Lower = stricter. 0.6 is face-api's default; 0.5 is safer.
app.face.match-threshold=0.5
app.totp.issuer=FaceAuth Group Project
app.login.max-failed-attempts=5
app.login.lockout-minutes=15
